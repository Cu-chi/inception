services:
    mariadb:
        container_name: mariadb
        networks:
            - inception
        build:
            context: requirements/mariadb
            dockerfile: Dockerfile
        env_file: .env
        secrets:
            - SQL_PASSWORD
            - SQL_ROOT_PASSWORD
        volumes:
            - mariadb:/var/lib/mysql
        restart: unless-stopped
    nginx:
        container_name: nginx
        networks:
            - inception
        depends_on:
            - wordpress
        volumes:
            - wordpress:/var/www/wordpress
        build:
            context: requirements/nginx
            dockerfile: Dockerfile
        env_file: .env
        ports:
            - "443:443"
        restart: on-failure
    
    wordpress:
        container_name: wordpress
        env_file: .env
        secrets:
            - WP_ADMIN_PASSWORD
            - WP_PASSWORD
            - SQL_PASSWORD
        volumes:
            - wordpress:/var/www/wordpress
        networks:
            - inception
        build: 
            context: requirements/wordpress
            dockerfile: Dockerfile
        depends_on:
            - mariadb
        restart: on-failure


# DATA_DIR is set in the .env
volumes:
    wordpress:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${DATA_DIR}/wordpress
    mariadb:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${DATA_DIR}/mariadb

networks:
    inception:
        driver: bridge

secrets:
    SQL_PASSWORD:
        file: ../secrets/db_password.txt
    SQL_ROOT_PASSWORD:
        file: ../secrets/db_root_password.txt
    WP_ADMIN_PASSWORD:
        file: ../secrets/wp_admin_password.txt
    WP_PASSWORD:
        file: ../secrets/wp_password.txt
